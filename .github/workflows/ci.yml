name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - run: mvn -B package -DskipTests
      - name: Verify packaged artifacts and CLI smoke path
        shell: bash
        run: |
          sha256sum target/just-sast-0.2.0.jar target/just-sast-0.2.0-verify8.jar
          java -jar target/just-sast-0.2.0.jar --help
          java -jar target/just-sast-0.2.0.jar scan \
            --jar target/just-sast-0.2.0.jar \
            --output target/ci-smoke \
            --no-verify
      - name: Verify packaged dynamic protocol
        shell: bash
        run: |
          java -jar target/just-sast-0.2.0.jar scan \
            --jar target/just-sast-0.2.0.jar \
            --output target/ci-dynamic \
            --verify-budget=1
          test -f target/ci-dynamic/verification/dynamic-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: just-sast
          path: |
            target/just-sast-*.jar
            target/ci-smoke/**
            target/ci-dynamic/**
