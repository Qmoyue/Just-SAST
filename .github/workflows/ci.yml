name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: just-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: ordinary tests, a reproducible launcher, and a harmless end-to-end
  # static scan that exercises both product modes and the dependency cache boundary.
  fast:
    name: fast (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
          - os: windows-latest
            java: '17'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Unit and semantic tests
        run: mvn -B test
      - name: Package thin and shaded artifacts
        run: mvn -B package -DskipTests
      - name: Verify packaged artifacts and shaded CLI smoke path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& mvn -q -DforceStdout help:evaluate '-Dexpression=project.version').Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw "invalid project version: $version" }
          $shaded = "target/just-sast-$version-shaded.jar"
          $thin = "target/just-sast-$version.jar"
          if (-not (Test-Path -LiteralPath $shaded -PathType Leaf)) { throw "missing shaded launcher: $shaded" }
          if (-not (Test-Path -LiteralPath $thin -PathType Leaf)) { throw "missing thin library artifact: $thin" }
          & java -jar $shaded --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged hashes and entry points
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& mvn -q -DforceStdout help:evaluate '-Dexpression=project.version').Trim()
          $shaded = Get-Item -LiteralPath "target/just-sast-$version-shaded.jar"
          $thin = Get-Item -LiteralPath "target/just-sast-$version.jar"
          if ($shaded.Length -le $thin.Length) { throw 'shaded artifact must contain dependencies and be larger than thin artifact' }
          $main = & jar tf $shaded.FullName
          if (-not ($main -contains 'META-INF/MANIFEST.MF')) { throw 'shaded manifest missing' }
          if (-not ($main -contains 'picocli/CommandLine.class')) { throw 'shaded dependency content missing' }
      - name: Static CLI smoke (two modes, target JDK, online then offline)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& mvn -q -DforceStdout help:evaluate '-Dexpression=project.version').Trim()
          $shaded = (Resolve-Path "target/just-sast-$version-shaded.jar").Path
          $fixture = Join-Path $env:RUNNER_TEMP 'just-static-smoke.jar'
          $cache = Join-Path $env:RUNNER_TEMP 'just-static-smoke-cache'
          $componentOutput = Join-Path $env:RUNNER_TEMP 'just-static-smoke-component'
          $applicationOutput = Join-Path $env:RUNNER_TEMP 'just-static-smoke-application'
          $pom = (Resolve-Path 'src/test/resources/ci-smoke/pom.xml').Path
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          & jar --create --file $fixture `
            -C 'target/test-classes' fixture/CiSmokeEntry.class `
            -C 'target/test-classes' org/springframework/web/bind/annotation/RestController.class `
            -C 'target/test-classes' org/springframework/web/bind/annotation/PostMapping.class
          if ($LASTEXITCODE -ne 0) { throw "fixture packaging failed: $LASTEXITCODE" }
          & java -jar $shaded scan --jar $fixture --mode component --pom $pom `
            --jdk-home $env:JAVA_HOME --output $componentOutput --cache $cache
          if ($LASTEXITCODE -ne 0) { throw "component smoke failed: $LASTEXITCODE" }
          & java -jar $shaded scan --jar $fixture --mode application --pom $pom `
            --jdk-home $env:JAVA_HOME --offline --output $applicationOutput --cache $cache
          if ($LASTEXITCODE -ne 0) { throw "application offline smoke failed: $LASTEXITCODE" }
          foreach ($report in @(
              (Join-Path $componentOutput 'report.json'),
              (Join-Path $applicationOutput 'report.json'))) {
            if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
              throw "smoke report missing: $report"
            }
          }
          & pwsh -NoProfile -File .github/scripts/validate-static-report.ps1 `
            -ReportDirectory $componentOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File .github/scripts/validate-static-report.ps1 `
            -ReportDirectory $applicationOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload fast build artifacts
        if: always() && runner.os == 'Linux' && matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: just-sast-fast
          path: |
            target/just-sast-*.jar
