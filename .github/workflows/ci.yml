name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: just-sast
          path: target/just-sast-*.jar
