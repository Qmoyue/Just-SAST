  # 文件操作 sink 扩充
  - id: JUST-SINK-FILES-MUTATE
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: java/nio/file/Files, name: "~^(?:copy|move|delete|deleteIfExists|write|writeString|createFile|createDirectory|createDirectories|createTempFile|createTempDirectory|createLink|createSymbolicLink)$" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-FILE-MUTATE
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: java/io/File, name: "~^(?:delete|mkdir|mkdirs|renameTo|createNewFile)$" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-MULTIPART-TRANSFER
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: "~^(?:org/springframework/web/multipart/MultipartFile|javax/servlet/http/Part|jakarta/servlet/http/Part)$", name: "~^(?:transferTo|write)$" }
    tainted: [{arg: 0}]

  # 反射 sink 扩充
  - id: JUST-SINK-CLASSLOADER-LOADCLASS
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: MEDIUM
    match:
      call: { owner: "~^(?:java/lang/ClassLoader|java/net/URLClassLoader)$", name: "~^(?:loadClass|newInstance)$" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-SUN-METHODUTIL
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "~^(?:sun/reflect/misc/MethodUtil|sun/reflect/NativeMethodAccessorImpl)$", name: "~^(?:invoke|invoke0)$" }
    tainted: [{arg: 1}]

  - id: JUST-SINK-INTROSPECTOR
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: MEDIUM
    match:
      call: { owner: java/beans/Introspector, name: getBeanInfo }
    tainted: [{arg: 0}]

  # model 扩充：字符串/集合/URL 的声明式污点透传（覆盖链上高频中转方法）
  - id: JUST-MODEL-STRING-CONCAT
    kind: model
    match:
      call: { owner: java/lang/String, name: concat }
    actions: { return: [arg0] }

  - id: JUST-MODEL-STRING-OPS
    kind: model
    match:
      call: { owner: java/lang/String, name: "~^(?:trim|substring|toUpperCase|toLowerCase|replace|split|valueOf|toString|intern|getBytes)$" }
    actions: { return: [this] }

  - id: JUST-MODEL-STRING-FORMAT
    kind: model
    match:
      call: { owner: java/lang/String, name: format }
    actions: { return: [arg0, arg1] }

  - id: JUST-MODEL-STRINGBUILDER-APPEND
    kind: model
    match:
      call: { owner: "~^(?:java/lang/StringBuilder|java/lang/StringBuffer)$", name: append }
    actions: { this: [arg0], return: [this] }

  - id: JUST-MODEL-STRINGBUILDER-TOSTRING
    kind: model
    match:
      call: { owner: "~^(?:java/lang/StringBuilder|java/lang/StringBuffer)$", name: toString }
    actions: { return: [this] }

  - id: JUST-MODEL-MAP-GET
    kind: model
    match:
      call: { owner: java/util/Map, name: get }
    actions: { return: [this] }

  - id: JUST-MODEL-LIST-ADD
    kind: model
    match:
      call: { owner: java/util/List, name: add }
    actions: { this: [arg0] }

  - id: JUST-MODEL-OBJECT-TOSTRING
    kind: model
    match:
      call: { owner: java/lang/Object, name: toString }
    actions: { return: [this] }

  - id: JUST-MODEL-COLLECTIONS-UNMODIFIABLE
    kind: model
    match:
      call: { owner: java/util/Collections, name: "~^unmodifiable" }
    actions: { return: [arg0] }

  - id: JUST-MODEL-URL-CTOR
    kind: model
    match:
      call: { owner: "~^(?:java/net/URL|java/net/URI)$", name: "<init>" }
    actions: { this: [arg0] }

  - id: JUST-MODEL-STRING-JOIN
    kind: model
    match:
      call: { owner: java/lang/String, name: join }
    actions: { return: [arg0, arg1] }
