rules:
  # ---- sink 起点 ----
  - id: JUST-SINK-COMMAND-EXEC-RUNTIME
    kind: sink
    category: COMMAND_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Runtime", name: "exec" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-COMMAND-EXEC-PROCESSBUILDER
    kind: sink
    category: COMMAND_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/ProcessBuilder", name: "start" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-CLASSLOAD-FORNAME
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Class", name: "forName" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-CLASSLOAD-NEWINSTANCE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/Class", name: "newInstance" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-TEMPLATESIMPL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "com/sun/org/apache/xalan/internal/xsltc/trax/TemplatesImpl", name: ~"getOutputProperties|newTransformer" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-JNDI-LOOKUP
    kind: sink
    category: JNDI
    severity: HIGH
    match:
      call: { owner: "javax/naming/Context", name: ~"lookup|list|bind" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-REFLECTIVE-INVOKE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/reflect/Method", name: "invoke" }
    tainted: [{arg: 0}, {arg: 1}]

  - id: JUST-SINK-REFLECTIVE-NEWINSTANCE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/reflect/Constructor", name: "newInstance" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-CLASSLOADER-DEFINECLASS
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/ClassLoader", name: "defineClass" }
    tainted: [{arg: 1}]

  - id: JUST-SINK-SCRIPT-ENGINE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/script/ScriptEngine", name: "eval" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-SCRIPT-ENGINEMANAGER
    kind: sink
    category: CODE_EXEC
    severity: MEDIUM
    match:
      call: { owner: "javax/script/ScriptEngineManager", name: "getEngineByName" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-TEMPLATESIMPL-OLD-PACKAGE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/apache/xalan/xsltc/trax/TemplatesImpl", name: ~"getOutputProperties|newTransformer" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-BCEL-CLASSLOADER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "com/sun/org/apache/bcel/internal/util/ClassLoader", name: ~"loadClass|createClass" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-HUTOOL-DESERIALIZE
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "cn/hutool/core/util/ObjectUtil", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-HUTOOL-SERIALIZEUTIL
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "cn/hutool/core/util/SerializeUtil", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-COMMONS-SERIALIZATIONUTILS
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "org/apache/commons/lang3/SerializationUtils", name: ~"deserialize|roundtrip" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-SPRING-SERIALIZATIONUTILS
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "org/springframework/util/SerializationUtils", name: "deserialize" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-JMX-INVOKE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/management/MBeanServer", name: "invoke" }
    tainted: [{arg: 1}, {arg: 2}]

  - id: JUST-SINK-METHODHANDLE-INVOKE
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "java/lang/invoke/MethodHandle", name: ~"invoke.*" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-SPEL-GETVALUE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/springframework/expression/Expression", name: "getValue" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-GROOVY-SHELL-EVALUATE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "groovy/lang/GroovyShell", name: "evaluate" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-GROOVY-CLASSLOADER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "groovy/lang/GroovyClassLoader", name: ~"parseClass|defineClass" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-OGNL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "ognl/Ognl", name: ~"getValue|parseExpression" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-MVEL-EVAL
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/mvel2/MVEL", name: ~"eval|evalFile" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-EL-PROCESSOR
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/el/ELProcessor", name: ~"eval|getValue" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-XMLDECODER
    kind: sink
    category: DESERIALIZE
    severity: HIGH
    match:
      call: { owner: "java/beans/XMLDecoder", name: "readObject" }
    tainted: [{receiver: true}]

  # ---- 以下 sink 从 tabby/GadgetInspector/CodeQL 公开清单移植 ----
  - id: JUST-SINK-PROCESSBUILDER-CTOR
    kind: sink
    category: COMMAND_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/ProcessBuilder", name: "<init>" }
    tainted: [{arg: 0}]
  # 来源：GI isSink（构造器副作用）——补我们只有 start+receiver 的缺口

  - id: JUST-SINK-CC-TRANSFORMER
    kind: sink
    category: REFLECTIVE_INVOKE
    severity: HIGH
    match:
      call: { owner: "org/apache/commons/collections/Transformer", name: "transform" }
    tainted: [{receiver: true}]
  # 来源：su18"sink 前置"——CC 链终点直接 sink 化，砍掉冗长中间链

  - id: JUST-SINK-SQL-EXECUTE
    kind: sink
    category: SQLI
    severity: HIGH
    match:
      call: { owner: "java/sql/Statement", name: ~"execute|executeQuery|executeUpdate|executeBatch" }
    tainted: [{arg: 0}]
  # 来源：tabby SQLI 规则

  - id: JUST-SINK-SQL-PREPARE
    kind: sink
    category: SQLI
    severity: HIGH
    match:
      call: { owner: "java/sql/Connection", name: ~"prepareStatement|prepareCall" }
    tainted: [{arg: 0}]
  # 来源：tabby SQLI 规则

  - id: JUST-SINK-URL-OPEN
    kind: sink
    category: SSRF
    severity: HIGH
    match:
      call: { owner: "java/net/URL", name: ~"openConnection|openStream" }
    tainted: [{receiver: true}]
  # 来源：GI isSink + tabby SSRF 规则

  - id: JUST-SINK-FILE-OUTPUT
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: "java/io/FileOutputStream", name: "<init>" }
    tainted: [{arg: 0}]
  # 来源：GI isSink

  - id: JUST-SINK-FILES-NEWOUTPUT
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: "java/nio/file/Files", name: "newOutputStream" }
    tainted: [{arg: 0}]
  # 来源：GI isSink

  - id: JUST-SINK-FREEMARKER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "freemarker/template/Template", name: "process" }
    tainted: [{arg: 0}]
  # 来源：社区 gadget 常用（模板注入）

  - id: JUST-SINK-VELOCITY
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "org/apache/velocity/app/Velocity", name: "evaluate" }
    tainted: [{arg: 1}]
  # 来源：社区 gadget 常用（模板注入）

  # ---- source 入口（替代反序列化框架：Kryo/SnakeYAML/XStream/Hessian/Fastjson 等） ----
  # bridge = deserialize：入口→框架管线→构造器/setter 反射（KS14 语义）
  # bridge = serialize：入口→框架管线→getter 反射（KS12 语义）
  - id: JUST-SOURCE-KRYO
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/esotericsoftware/kryo/Kryo", name: ~"readClassAndObject|readObject|readObjectOrNull" }
    safe-config: { owner: "com/esotericsoftware/kryo/Kryo", methods: [setRegistrationRequired] }

  - id: JUST-SOURCE-KRYO5
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/esotericsoftware/kryo/kryo5/Kryo", name: ~"readClassAndObject|readObject|readObjectOrNull" }
    safe-config: { owner: "com/esotericsoftware/kryo/kryo5/Kryo", methods: [setRegistrationRequired] }
  # 来源：CodeQL Kryo.qll（kryo5 包同建模）；safe-config 同 Kryo.setRegistrationRequired 流

  - id: JUST-SOURCE-SNAKEYAML
    kind: source
    bridge: deserialize
    match:
      call: { owner: "org/yaml/snakeyaml/Yaml", name: ~"load|loadAs|loadAll|compose|composeAll|parse" }
    safe-config: { owner: "org/yaml/snakeyaml/constructor/SafeConstructor", methods: ["<init>"] }
  # 方法集来源：CodeQL SnakeYaml.qll（compose/composeAll/loadAll 补齐）；SafeConstructor 排除

  - id: JUST-SOURCE-XSTREAM
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/thoughtworks/xstream/XStream", name: ~"fromXML|unmarshal" }
    safe-config: { owner: "com/thoughtworks/xstream/XStream", methods: [addPermission, denyPermission, clearPermissions] }
  # unmarshal 来源：CodeQL XStream.qll；safe-config 为 addPermission(NoTypePermission.NONE) 硬化的名字级近似

  - id: JUST-SOURCE-HESSIAN
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/caucho/hessian/io/Hessian2Input", name: "readObject" }

  - id: JUST-SOURCE-FASTJSON1
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/alibaba/fastjson/JSON", name: ~"parseObject|parse|parseArray" }
    safe-config: { owner: "com/alibaba/fastjson/parser/ParserConfig", methods: [setSafeMode] }

  - id: JUST-SOURCE-FASTJSON2
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/alibaba/fastjson2/JSON", name: ~"parseObject|parse|parseArray" }

  - id: JUST-SERIALIZE-JACKSON-MAPPER
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/ObjectMapper", name: ~"writeValueAsString|writeValueAsBytes|writeValue" }

  - id: JUST-SERIALIZE-JACKSON-WRITER
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/ObjectWriter", name: ~"writeValueAsString|writeValueAsBytes|writeValue" }

  - id: JUST-SERIALIZE-JACKSON-NODE
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/node/InternalNodeMapper", name: ~"nodeToString|nodeToPrettyString" }

  - id: JUST-SERIALIZE-FASTJSON2-JSON
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/alibaba/fastjson2/JSON", name: ~"toJSONString|toJSONBytes|writeTo" }

  - id: JUST-SERIALIZE-FASTJSON2-OBJ
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/alibaba/fastjson2/JSONObject", name: ~"toString|toJSONString" }

  - id: JUST-SERIALIZE-FASTJSON2-ARR
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/alibaba/fastjson2/JSONArray", name: ~"toString|toJSONString" }

  - id: JUST-SERIALIZE-GSON
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/google/gson/Gson", name: "toJson" }

  - id: JUST-SERIALIZE-XSTREAM
    kind: source
    bridge: serialize
    match:
      call: { owner: "com/thoughtworks/xstream/XStream", name: "toXML" }

  - id: JUST-SERIALIZE-SNAKEYAML
    kind: source
    bridge: serialize
    match:
      call: { owner: "org/yaml/snakeyaml/Yaml", name: ~"dump|dumpAs" }

  - id: JUST-SERIALIZE-HUTOOL
    kind: source
    bridge: serialize
    match:
      call: { owner: "cn/hutool/json/JSONUtil", name: "toJsonStr" }

  # ---- 以下 source 从 CodeQL 16 框架清单移植（deserialize 侧） ----
  - id: JUST-SOURCE-GSON-FROMJSON
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/google/gson/Gson", name: ~"fromJson" }

  - id: JUST-SOURCE-JACKSON-READVALUE
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/ObjectMapper", name: ~"readValue|readTree|readValueAsTree" }
    safe-config: { owner: "com/fasterxml/jackson/databind/ObjectMapper", methods: [deactivateDefaultTyping, setPolymorphicTypeValidator] }
  # safe-config 来源：CodeQL SafeObjectMapperConfig（activateDefaultTyping 为 CodeQL 未建模的留白，此处不抑制）

  # A3: Jackson @JsonTypeInfo 注解检测——注解类存在即多态反序列化开放
  - id: JUST-SOURCE-JACKSON-JSONTYPEINFO
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/ObjectMapper", name: "readValue" }

  - id: JUST-SOURCE-JACKSON-READER
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/fasterxml/jackson/databind/ObjectReader", name: ~"readValue|readTree" }

  - id: JUST-SOURCE-YAMLBEANS
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/esotericsoftware/yamlbeans/YamlReader", name: "read" }
  # 来源：CodeQL YamlBeans model.yml + marshalsec 源码（owner 修正：com.esotericsoftware）

  - id: JUST-SOURCE-JMS-OBJMSG
    kind: source
    bridge: deserialize
    match:
      call: { owner: "javax/jms/ObjectMessage", name: "getObject" }
  # 来源：CodeQL JMS ObjectMessage 模块

  - id: JUST-SOURCE-FLEXJSON
    kind: source
    bridge: deserialize
    match:
      call: { owner: "flexjson/JSONDeserializer", name: "deserialize" }
  # 来源：CodeQL Flexjson 模块

  - id: JUST-SOURCE-JODD
    kind: source
    bridge: deserialize
    match:
      call: { owner: "jodd/json/JsonParser", name: "parse" }
  # 来源：CodeQL Jodd Json 模块

  # ---- model 规则（tabby actions 模式）：JDK 集合/字符串的声明式污点透传 ----
  - id: MODEL-MAP-PUT
    kind: model
    match:
      call: { owner: "java/util/Map", name: "put" }
    actions: { this: [arg1] }
  # value 的污点传播到整个 Map（tabby: this<m> ← param-1）

  - id: MODEL-MAP-GET
    kind: model
    match:
      call: { owner: "java/util/Map", name: "get" }
    actions: { return: [this] }
  # 污染 Map 的 get 结果可控（tabby: return ← this）

  - id: MODEL-LIST-ADD
    kind: model
    match:
      call: { owner: "java/util/List", name: "add" }
    actions: { this: [arg0] }

  - id: MODEL-LIST-GET
    kind: model
    match:
      call: { owner: "java/util/List", name: "get" }
    actions: { return: [this] }

  - id: MODEL-SET-ADD
    kind: model
    match:
      call: { owner: "java/util/Set", name: "add" }
    actions: { this: [arg0] }

  - id: MODEL-STRING-VALUEOF
    kind: model
    match:
      call: { owner: "java/lang/String", name: "valueOf" }
    actions: { return: [arg0] }
  # String.valueOf(obj) 的返回值继承 obj 的污点

  - id: MODEL-STRING-CONCAT
    kind: model
    match:
      call: { owner: "java/lang/String", name: "concat" }
    actions: { return: [this, arg0] }

  - id: MODEL-STRINGBUILDER-APPEND
    kind: model
    match:
      call: { owner: "java/lang/StringBuilder", name: "append" }
    actions: { return: [this, arg0] }

  - id: MODEL-COLLECTION-ADDALL
    kind: model
    match:
      call: { owner: "java/util/Collection", name: "addAll" }
    actions: { this: [arg0] }

  - id: MODEL-COLLECTION-TOSTRING
    kind: model
    match:
      call: { owner: "java/util/AbstractCollection", name: "toString" }
    actions: { return: [this] }
  # 污染集合的 toString 结果可控（触发 hashCode/toString gadget 的关键桥接）

  # ---- 以下 sink 从 GadgetHunter 165 CVE 提炼清单补充（比前版多 9 sources / 15 sinks）----
  - id: JUST-SINK-SCRIPT-ENGINE-FACTORY
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/script/ScriptEngineFactory", name: "getScriptEngine" }
    tainted: [{receiver: true}]

  - id: JUST-SINK-URLCLASSLOADER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/net/URLClassLoader", name: "<init>" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-LOADLIBRARY
    kind: sink
    category: CODE_EXEC
    severity: MEDIUM
    match:
      call: { owner: "java/lang/System", name: "load" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-MBEAN-REGISTER
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "javax/management/MBeanServer", name: "registerMBean" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-NAMING-BIND
    kind: sink
    category: JNDI
    severity: HIGH
    match:
      call: { owner: "javax/naming/Naming", name: "bind" }
    tainted: [{arg: 1}]

  - id: JUST-SINK-EXECUTOR-EXECUTE
    kind: sink
    category: CODE_EXEC
    severity: MEDIUM
    match:
      call: { owner: "java/util/concurrent/Executor", name: "execute" }
    tainted: [{arg: 0}]

  - id: JUST-SINK-PROXY-NEWINSTANCE
    kind: sink
    category: CODE_EXEC
    severity: HIGH
    match:
      call: { owner: "java/lang/reflect/Proxy", name: "newProxyInstance" }
    tainted: [{arg: 2}]

  - id: JUST-SINK-CLASS-WRITE
    kind: sink
    category: FILE_WRITE
    severity: MEDIUM
    match:
      call: { owner: "java/io/FileWriter", name: "<init>" }
    tainted: [{arg: 0}]

  # ---- marshalsec 剩余框架（BlazeDS AMF0/3、Burlap、Castor、JsonIO、JYAML）----
  - id: JUST-SOURCE-BLAZEDS-AMF0
    kind: source
    bridge: deserialize
    match:
      call: { owner: "flex/messaging/io/amf/Amf0Input", name: "readObject" }

  - id: JUST-SOURCE-BLAZEDS-AMF3
    kind: source
    bridge: deserialize
    match:
      call: { owner: "flex/messaging/io/amf/Amf3Input", name: "readObject" }

  - id: JUST-SOURCE-BURLAP
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/caucho/burlap/client/BurlapInput", name: ~"readObject|readCall" }

  - id: JUST-SOURCE-CASTOR
    kind: source
    bridge: deserialize
    match:
      call: { owner: "org/exolab/castor/xml/Unmarshaller", name: "unmarshal" }

  - id: JUST-SOURCE-JSONIO
    kind: source
    bridge: deserialize
    match:
      call: { owner: "com/cedarsoftware/util/io/JsonReader", name: ~"jsonToJava|readObject" }

  - id: JUST-SOURCE-JYAML
    kind: source
    bridge: deserialize
    match:
      call: { owner: "org/jyaml/JYAML", name: ~"load|loadAs" }

  # ---- ysoserial 片段库扩充（hibernate/jrmp/spring/vaadin）----
  - id: FRAG-HIBERNATE1
    kind: chain-fragment
    entryClass: "org/hibernate/property/BasicPropertyAccessor$BasicGetter"
    entryKind: readObject
    hops:
      - { class: "org/hibernate/cfg/beanvalidation/BeanValidationEventListener", method: "getListener" }
    sinkOwner: "java/lang/reflect/Method"
    sinkName: "invoke"

  - id: FRAG-JRMP
    kind: chain-fragment
    entryClass: "java/rmi/server/UnicastRemoteObject"
    entryKind: readObject
    hops:
      - { class: "sun/rmi/server/UnicastRef", method: "invoke" }
    sinkOwner: "java/lang/reflect/Method"
    sinkName: "invoke"

  - id: FRAG-ROME
    kind: chain-fragment
    entryClass: "com/sun/syndication/feed/impl/EqualsBean"
    entryKind: equals
    hops:
      - { class: "com/sun/syndication/feed/impl/ToStringBean", method: "toString" }
    sinkOwner: "java/lang/reflect/Method"
    sinkName: "invoke"

  - id: FRAG-SPRING1
    kind: chain-fragment
    entryClass: "org/springframework/core/SerializableTypeWrapper$MethodInvokeTypeProvider"
    entryKind: readObject
    hops:
      - { class: "org/springframework/aop/framework/AdvisedSupport", method: "getTarget" }
    sinkOwner: "java/lang/reflect/Method"
    sinkName: "invoke"

  - id: FRAG-VAADIN
    kind: chain-fragment
    entryClass: "com/vaadin/spring/internal/UIScopeImpl$UIStoreWrapper"
    entryKind: readObject
    hops:
      - { class: "com/vaadin/spring/internal/UIScopeImpl", method: "getUi" }
    sinkOwner: "java/lang/reflect/Method"
    sinkName: "invoke"

  # ---- magic-entry 终点 ----
  # OIS 机制只回调 private readObject/readObjectNoData/writeObject（ObjectStreamClass 语义）
  - id: JUST-ENTRY-READOBJECT
    kind: magic-entry
    entryKind: readObject
    match:
      method: { name: "readObject", descriptor: "(Ljava/io/ObjectInputStream;)V", access: private }
      class: { implements: "java/io/Serializable" }

  - id: JUST-ENTRY-READRESOLVE
    kind: magic-entry
    entryKind: readResolve
    match:
      method: { name: "readResolve", descriptor: "()Ljava/lang/Object;" }
      class: { implements: "java/io/Serializable" }

