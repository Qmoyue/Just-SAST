    sinkName: "transform"

  # Declarative object-shape evidence for the Spring AOP / Jackson node variant commonly
  # used with a JDK 17 RMI return path.  The plan describes only allocations, field slots and
  # an inert JDK proxy; the verifier never serializes attacker-supplied bytes or executes the
  # TemplatesImpl body.  Keeping this in rule data lets other applications reuse the same
  # fragment without a class/package/benchmark branch in production code.
  - id: FRAG-JDK-EVENTLISTENER-SPRING-TEMPLATES
    kind: chain-fragment
    entryClass: "javax/swing/event/EventListenerList"
    entryKind: toString
    hops:
      - { class: "javax/swing/undo/UndoManager", method: "toString" }
      - { class: "java/util/Vector", method: "toString" }
      - { class: "com/fasterxml/jackson/databind/node/POJONode", method: "toString" }
      - { class: "org/springframework/aop/framework/JdkDynamicAopProxy", method: "invoke" }
      - { class: "javax/xml/transform/Templates", method: "getOutputProperties" }
    sinkOwner: "com/sun/org/apache/xalan/internal/xsltc/trax/TemplatesImpl"
    sinkName: "newTransformer"
    construction:
      nodes:
        - { id: entry, type: "javax/swing/event/EventListenerList", kind: allocate }
        - { id: undo, type: "javax/swing/undo/UndoManager", kind: allocate }
        - { id: edits, type: "java/util/Vector", kind: allocate }
        - { id: node, type: "com/fasterxml/jackson/databind/node/POJONode", kind: allocate }
        - { id: templates, type: "com/sun/org/apache/xalan/internal/xsltc/trax/TemplatesImpl", kind: allocate }
        # The target framework handler is intentionally replaced by a probe-owned, inert
        # interface/target adapter. The static path still records JdkDynamicAopProxy.invoke;
        # dynamic evidence is explicitly sink-distorted and never claims framework execution.
        - { id: proxy, type: "javax/xml/transform/Templates", kind: reflective_proxy, args: [{ ref: templates }, { string: "getOutputProperties" }] }
      fields:
        - { owner: entry, field: listenerList, values: [{ class: "java/lang/Class" }, { ref: undo }] }
        - { owner: undo, field: edits, values: [{ ref: edits }] }
        - { owner: edits, field: elementData, values: [{ ref: node }] }
        - { owner: edits, field: elementCount, values: [{ int: 1 }] }
        - { owner: node, field: _value, values: [{ ref: proxy }] }
        - { owner: templates, field: _name, values: [{ string: "just-safe-template" }] }

