  - id: FRAG-CC1
    kind: chain-fragment
    entryClass: "sun/reflect/annotation/AnnotationInvocationHandler"
    entryKind: proxyInvoke
    hops:
      - { class: "org/apache/commons/collections/map/LazyMap", method: "get", field: "factory" }
